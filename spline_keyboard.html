<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spline Embed</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="splineCanvas"></canvas>

    <script type="module">
        import { Application } from "https://unpkg.com/@splinetool/runtime@latest/build/runtime.js";

        const canvas = document.getElementById("splineCanvas");
        const spline = new Application(canvas);

        spline.load("https://prod.spline.design/J8wW0BS2QL7FdIqy/scene.splinecode")
            .then(() => {
                console.log("Spline loaded");

                window.onmessage = (event) => {
                console.log("iframe receiving));
                spline.emitEvent("Keydown");
            });
            })
    </script>
</body>
</html>
